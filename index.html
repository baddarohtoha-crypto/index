<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คืนนี้มีที่นอน - จองห้องพักด่วนราคาพิเศษ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>🌙</span> คืนนี้มีที่นอน
            </h1>
            <span class="text-xs bg-indigo-800 px-2 py-1 rounded-full text-indigo-200">ดีลด่วนวันนี้</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Banner แจ้งเตือน -->
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-amber-800 text-sm flex items-center gap-2">
            <span>⚡</span> จองด่วนภายใน 23:59 น. คืนนี้เท่านั้น!
        </div>

        <!-- รายการห้องพัก -->
        <div class="space-y-4" id="hotelList">

            <!-- Card 1 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80" class="w-full h-40 object-cover rounded-xl" alt="Hotel">
                    <span class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-md">ลด 60%</span>
                </div>
                <div class="mt-3">
                    <h3 class="font-bold text-lg text-slate-800">โรงแรมเดอะซิตี้ บูทีค</h3>
                    <p class="text-xs text-slate-500">📍 ห่างจากคุณ 1.2 กม.</p>
                    <div class="flex justify-between items-end mt-3">
                        <div>
                            <span class="text-xs text-slate-400 line-through">฿2,200</span>
                            <div class="text-xl font-extrabold text-indigo-600">฿890 <span class="text-xs font-normal text-slate-500">/คืน</span></div>
                        </div>
                        <button onclick="openBookingModal('โรงแรมเดอะซิตี้ บูทีค', 'Deluxe Room', 890)" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
                            จองคืนนี้
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=600&q=80" class="w-full h-40 object-cover rounded-xl" alt="Hotel">
                    <span class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-md">เหลือ 1 ห้องสุดท้าย</span>
                </div>
                <div class="mt-3">
                    <h3 class="font-bold text-lg text-slate-800">แกรนด์ โฮสเทล & สปา</h3>
                    <p class="text-xs text-slate-500">📍 ห่างจากคุณ 2.5 กม.</p>
                    <div class="flex justify-between items-end mt-3">
                        <div>
                            <span class="text-xs text-slate-400 line-through">฿1,500</span>
                            <div class="text-xl font-extrabold text-indigo-600">฿550 <span class="text-xs font-normal text-slate-500">/คืน</span></div>
                        </div>
                        <button onclick="openBookingModal('แกรนด์ โฮสเทล & สปา', 'Standard Room', 550)" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
                            จองคืนนี้
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal ฟอร์มจองห้องพัก -->
    <div id="bookingModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 relative shadow-xl">
            <button onclick="closeBookingModal()" class="absolute top-4 right-4 text-slate-400 text-xl font-bold">&times;</button>
            <h2 class="text-xl font-bold text-slate-800 mb-1">ยืนยันการจองด่วน</h2>
            <p id="modalHotelDetails" class="text-sm text-indigo-600 font-medium mb-4"></p>

            <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-4">
                <input type="hidden" id="hotelNameInput">
                <input type="hidden" id="roomTypeInput">
                <input type="hidden" id="priceInput">

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ-นามสกุล ผู้เข้าพัก</label>
                    <input type="text" id="name" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="สมชาย ใจดี">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="tel" id="phone" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="08X-XXX-XXXX">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">
                    ยืนยันการจอง (ชำระเงินที่โรงแรม)
                </button>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ นำ Web App URL จาก Google Apps Script มาวางตรงนี้
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9AYDPGPv6fodBJnAI_TBv2TVNHgW6sUM3lVlPuaLrZzP0xcBsVKb-EFgtuFmILaKnqA/exec';
        let currentBooking = {};

        function openBookingModal(hotelName, roomType, price) {
            currentBooking = { hotelName, roomType, price };
            document.getElementById('modalHotelDetails').innerText = `${hotelName} (${roomType}) - ฿${price}`;
            document.getElementById('hotelNameInput').value = hotelName;
            document.getElementById('roomTypeInput').value = roomType;
            document.getElementById('priceInput').value = price;
            
            const modal = document.getElementById('bookingModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeBookingModal() {
            const modal = document.getElementById('bookingModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function submitBooking(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังบันทึกข้อมูล...';

            const today = new Date().toISOString().split('T')[0];

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                hotelName: currentBooking.hotelName,
                roomType: currentBooking.roomType,
                price: currentBooking.price,
                checkInDate: today
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('🎉 จองสำเร็จ! โปรดแสดงหน้าจอนี้แก่เจ้าหน้าที่โรงแรมเมื่อเข้าพัก');
                closeBookingModal();
                document.getElementById('bookingForm').reset();
            })
            .catch(error => {
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                console.error('Error!', error.message);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ยืนยันการจอง (ชำระเงินที่โรงแรม)';
            });
        }
    </script>
</body>
</html>
