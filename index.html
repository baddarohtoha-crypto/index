<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>IT Open House Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f8fafc; }
    .box { background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; max-width: 600px; }
    .field { margin-bottom: 10px; }
    label { display: inline-block; width: 140px; font-weight: bold; }
    input, select { padding: 6px; width: 200px; }
    button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

  <h2>ฟอร์มลงทะเบียน Open House (บันทึกลง Google Sheets)</h2>
  
  <div class="box">
    <form id="myForm">
      <div class="field">
        <label>คำนำหน้า:</label>
        <select id="title">
          <option value="นาย">นาย</option>
          <option value="นางสาว">นางสาว</option>
        </select>
      </div>
      <div class="field">
        <label>ชื่อ-นามสกุล:</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="field">
        <label>เพศ:</label>
        <select id="gender">
          <option value="ชาย">ชาย</option>
          <option value="หญิง">หญิง</option>
          <option value="ทางเลือก">ทางเลือก</option>
        </select>
      </div>
      <div class="field">
        <label>อายุ:</label>
        <input type="number" id="age" required>
      </div>
      <div class="field">
        <label>ระดับชั้น:</label>
        <input type="text" id="level" required>
      </div>
      <div class="field">
        <label>ชื่อโรงเรียน:</label>
        <input type="text" id="school" required>
      </div>
      <div class="field">
        <label>เบอร์โทรศัพท์:</label>
        <input type="text" id="phone" required>
      </div>
      <div class="field">
        <label>Line ID:</label>
        <input type="text" id="lineId" required>
      </div>
      <div class="field">
        <label>สาขาที่สนใจ:</label>
        <select id="major">
          <option value="เทคโนโลยีดิจิทัล">เทคโนโลยีดิจิทัล</option>
          <option value="เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล">เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล</option>
          <option value="ดิจิทัลมีเดียอาร์ต">ดิจิทัลมีเดียอาร์ต</option>
          <option value="วิศวกรรมความปลอดภัย">วิศวกรรมความปลอดภัย</option>
          <option value="ไม่สนใจ">ไม่สนใจ</option>
        </select>
      </div>
      <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
  </div>

  <h2>Dashboard สรุปผล</h2>
  <div class="box" style="height: 300px;">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    // ** นำ URL ที่ได้จาก Google Apps Script มาวางในอัญประกาศด้านล่างนี้ **
    const GOOGLE_SCRIPT_URL = 'ใส่_URL_WEB_APP_ตรงนี้';

    const dataCounts = {
      'เทคโนโลยีดิจิทัล': 0,
      'เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล': 0,
      'ดิจิทัลมีเดียอาร์ต': 0,
      'วิศวกรรมความปลอดภัย': 0,
      'ไม่สนใจ': 0
    };

    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: Object.keys(dataCounts),
        datasets: [{ label: 'จำนวนคน', data: Object.values(dataCounts), backgroundColor: '#4f46e5' }]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });

    document.getElementById('myForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      const formData = {
        title: document.getElementById('title').value,
        fullName: document.getElementById('fullName').value,
        gender: document.getElementById('gender').value,
        age: document.getElementById('age').value,
        level: document.getElementById('level').value,
        school: document.getElementById('school').value,
        phone: document.getElementById('phone').value,
        lineId: document.getElementById('lineId').value,
        major: document.getElementById('major').value
      };

      // ส่งข้อมูลเข้า Google Sheets
      fetch(GOOGLE_SCRIPT_URL https://script.google.com/macros/s/AKfycbzAHH97MwhMQHHgX4OaQbAk7cFdOdWKtlRoeVPkFUj9xGUWxAHCaQXmYxf9ha2KwJQTEA/exec, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        // อัปเดตกราฟหน้าเว็บ
        dataCounts[formData.major]++;
        myChart.data.datasets[0].data = Object.values(dataCounts);
        myChart.update();

        alert('บันทึกข้อมูลลง Google Sheets เรียบร้อยแล้ว!');
        document.getElementById('myForm').reset();
      })
      .catch(error => {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
        console.error(error);
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = 'บันทึกข้อมูล';
      });
    });
  </script>

</body>
</html>
