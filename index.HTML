<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>IT Open House</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    .field { margin-bottom: 10px; }
    label { display: inline-block; width: 150px; }
  </style>
</head>
<body>

  <h2>ฟอร์มลงทะเบียน Open House คณะไอที</h2>
  
  <div class="box">
    <form id="myForm">
      <div class="field">
        <label>คำนำหน้า:</label>
        <select id="title">
          <option value="นาย">นาย</option>
          <option value="นางสาว">นางสาว</option>
        </select>
      </div>

      <div class="field">
        <label>ชื่อ-นามสกุล:</label>
        <input type="text" id="fullname" required>
      </div>

      <div class="field">
        <label>เพศ:</label>
        <select id="gender">
          <option value="ชาย">ชาย</option>
          <option value="หญิง">หญิง</option>
        </select>
      </div>

      <div class="field">
        <label>อายุ:</label>
        <input type="number" id="age" required>
      </div>

      <div class="field">
        <label>ระดับชั้น:</label>
        <input type="text" id="level" required>
      </div>

      <div class="field">
        <label>ชื่อโรงเรียน:</label>
        <input type="text" id="school" required>
      </div>

      <div class="field">
        <label>เบอร์โทรศัพท์:</label>
        <input type="text" id="phone" required>
      </div>

      <div class="field">
        <label>Line ID:</label>
        <input type="text" id="lineId" required>
      </div>

      <div class="field">
        <label>สาขาที่สนใจ:</label>
        <select id="major">
          <option value="เทคโนโลยีดิจิทัล">เทคโนโลยีดิจิทัล</option>
          <option value="เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล">เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล</option>
          <option value="ดิจิทัลมีเดียอาร์ต">ดิจิทัลมีเดียอาร์ต</option>
          <option value="วิศวกรรมความปลอดภัย">วิศวกรรมความปลอดภัย</option>
          <option value="ไม่สนใจ">ไม่สนใจ</option>
        </select>
      </div>

      <button type="submit">บันทึกข้อมูล</button>
    </form>
  </div>

  <h2>Dashboard</h2>
  <div class="box" style="width: 500px; height: 300px;">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    var dataCounts = {
      'เทคโนโลยีดิจิทัล': 0,
      'เทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล': 0,
      'ดิจิทัลมีเดียอาร์ต': 0,
      'วิศวกรรมความปลอดภัย': 0,
      'ไม่สนใจ': 0
    };

    var ctx = document.getElementById('myChart').getContext('2d');
    var myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: Object.keys(dataCounts),
        datasets: [{
          label: 'จำนวนคน',
          data: Object.values(dataCounts),
          backgroundColor: 'blue'
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    document.getElementById('myForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var selected = document.getElementById('major').value;
      dataCounts[selected]++;
      myChart.data.datasets[0].data = Object.values(dataCounts);
      myChart.update();
      alert('บันทึกเรียบร้อย');
      this.reset();
    });
  </script>

</body>
</html>
